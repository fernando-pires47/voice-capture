services:
  api:
    image: ${DOCKER_REPOSITORY:?Defina DOCKER_REPOSITORY na stack}:voice-capture-server-${BACKEND_VERSION:?Defina BACKEND_VERSION na stack}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:?Defina APP_ENV na stack}
      LOG_LEVEL: ${LOG_LEVEL:?Defina LOG_LEVEL na stack}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:?Defina AI_TIMEOUT_SECONDS na stack}
      MAX_TEXT_CHARS: ${MAX_TEXT_CHARS:?Defina MAX_TEXT_CHARS na stack}
      MAX_AUDIO_MB: ${MAX_AUDIO_MB:?Defina MAX_AUDIO_MB na stack}
      CORS_ORIGINS: ${CORS_ORIGINS:?Defina CORS_ORIGINS na stack}
      AI_GRAMMAR_DEFAULT_PROVIDER: ${AI_GRAMMAR_DEFAULT_PROVIDER:?Defina AI_GRAMMAR_DEFAULT_PROVIDER na stack}
      AI_GRAMMAR_DEFAULT_MODEL: ${AI_GRAMMAR_DEFAULT_MODEL:?Defina AI_GRAMMAR_DEFAULT_MODEL na stack}
      AI_DEFAULT_LANGUAGE: ${AI_DEFAULT_LANGUAGE:?Defina AI_DEFAULT_LANGUAGE na stack}
      AI_SUPPORTED_LANGUAGES: ${AI_SUPPORTED_LANGUAGES:?Defina AI_SUPPORTED_LANGUAGES na stack}
      AI_ALLOWED_GRAMMAR_PROVIDERS: ${AI_ALLOWED_GRAMMAR_PROVIDERS:?Defina AI_ALLOWED_GRAMMAR_PROVIDERS na stack}
      AI_ALLOWED_MODELS_GEMINI_CORRECT: ${AI_ALLOWED_MODELS_GEMINI_CORRECT}
      AI_ALLOWED_MODELS_ZAI_CORRECT: ${AI_ALLOWED_MODELS_ZAI_CORRECT}
      AI_ALLOWED_MODELS_OPENROUTER_CORRECT: ${AI_ALLOWED_MODELS_OPENROUTER_CORRECT}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL}
      GEMINI_TRANSCRIBE_MODEL: ${GEMINI_TRANSCRIBE_MODEL}
      ZAI_API_KEY: ${ZAI_API_KEY}
      ZAI_BASE_URL: ${ZAI_BASE_URL}
      ZAI_TRANSCRIBE_MODEL: ${ZAI_TRANSCRIBE_MODEL}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL}
      OPENROUTER_TRANSCRIBE_MODEL: ${OPENROUTER_TRANSCRIBE_MODEL}
    ports:
      - "${API_PORT}:8000"

  web:
    image: ${DOCKER_REPOSITORY:?Defina DOCKER_REPOSITORY na stack}:voice-capture-client-${FRONTEND_VERSION:?Defina FRONTEND_VERSION na stack}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT}:80"
